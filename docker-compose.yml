services:
  # --- INFRASTRUCTURE ---
  milvus:
    image: milvusdb/milvus:v2.4.0
    container_name: ai_kb_milvus
    network_mode: host
    environment:
      - ETCD_ENDPOINTS=localhost:2379
      - MINIO_ADDRESS=localhost:9000
    command: milvus run standalone
    volumes:
      - milvus_data:/var/lib/milvus
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: always

  etcd:
    image: quay.io/coreos/etcd:v3.5.5
    container_name: ai_kb_etcd
    network_mode: host
    environment:
      - ETCD_AUTO_COMPACTION_RETENTION=1
    command: etcd --advertise-client-urls http://127.0.0.1:2379 --listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: ai_kb_minio
    network_mode: host
    environment:
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5

  neo4j:
    image: neo4j:5.12-community
    container_name: ai_kb_neo4j
    network_mode: host
    environment:
      - NEO4J_AUTH=neo4j/password
    volumes:
      - neo4j_data:/data
    restart: always

  # --- APPLICATION LAYER ---
  api-kb:
    build: .
    container_name: ai_kb_api
    network_mode: host
    environment:
      - REDIS_URL=redis://localhost:6379/0
      - MILVUS_URI=http://localhost:19530
      - NEO4J_URI=bolt://localhost:7687
    env_file:
      - .env
    volumes:
      - ./models_cache:/app/models_cache
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./media:/app/media
    depends_on:
      milvus:
        condition: service_started
    restart: always

  worker-kb:
    build: .
    container_name: ai_kb_worker
    network_mode: host
    command: celery -A app.services.tasks.celery_app worker -Q default --loglevel=info
    environment:
      - REDIS_URL=redis://localhost:6379/0
      - MILVUS_URI=http://localhost:19530
      - NEO4J_URI=bolt://localhost:7687
    env_file:
      - .env
    volumes:
      - ./models_cache:/app/models_cache
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./media:/app/media
    depends_on:
      milvus:
        condition: service_started
    restart: always

  worker-heavy:
    build: .
    network_mode: host
    command: celery -A app.services.tasks.celery_app worker -Q heavy_ingest --concurrency=2 --loglevel=info
    environment:
      - REDIS_URL=redis://localhost:6379/0
      - MILVUS_URI=http://localhost:19530
      - NEO4J_URI=bolt://localhost:7687
    env_file:
      - .env
    volumes:
      - ./models_cache:/app/models_cache
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./media:/app/media
    depends_on:
      milvus:
        condition: service_started
    profiles:
      - scale
    restart: always

volumes:
  milvus_data:
  neo4j_data:
